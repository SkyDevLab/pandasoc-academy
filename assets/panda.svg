 <path d="M168 191q12-14 24 0q-2 11-12 11t-12-11" fill="#202922"/>
 <path d="M180 202v8m0 0q-12 12-22 0m22 0q12 12 22 0" fill="none" stroke="#202922" stroke-width="4" stroke-linecap="round"/>
