<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">PandaSOC detective panda mascot</title><desc id="desc">A cheerful round panda in an emerald hoodie holding a magnifying glass and bamboo.</desc>
<defs>
 <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43a765"/><stop offset="1" stop-color="#17613c"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#e8eee4"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fff0"/><stop offset="1" stop-color="#a8e6ae"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#183c27" flood-opacity=".16"/></filter>
</defs>
<ellipse cx="180" cy="390" rx="110" ry="18" fill="#d9e8d5"/>
